name: Test, build and deploy to Render
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax
        run: npm run check
      - name: Test HTTP behaviour
        run: npm test
      - name: Build release image
        run: docker build --build-arg APP_VERSION="$GITHUB_SHA" -t cloud-demo:test .
      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cloud-demo -p 8080:8080 cloud-demo:test
          trap 'docker logs cloud-demo; docker rm -f cloud-demo' EXIT
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --connect-timeout 2 --max-time 5 --output /tmp/cloud-demo-health.json http://127.0.0.1:8080/health
          python3 -c 'import json; assert json.load(open("/tmp/cloud-demo-health.json"))["status"] == "ok"'
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --connect-timeout 2 --max-time 5 --output /tmp/cloud-demo-version.json http://127.0.0.1:8080/
          python3 -c 'import json,os; assert json.load(open("/tmp/cloud-demo-version.json"))["version"] == os.environ["GITHUB_SHA"]'
  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy tested commit and verify live version
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/deploy-render.mjs
